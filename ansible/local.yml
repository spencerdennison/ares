- name: setup olympus
  hosts: localhost
  connection: local
  become: true
  vars_files:
    - vars/all.yml

  roles:
    - network
    - aur
    - packages
    - dotfiles
    - role: docker
      when: ansible_facts["hostname"] == 'ares'
    - role: cadvisor
      when: ansible_facts["hostname"] == 'ares'
    - role: node-exporter
      when: ansible_facts["hostname"] == 'ares'
    - role: gaming
      when: ansible_facts["hostname"] == 'ares'
