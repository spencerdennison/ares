- name: install pacman pkgs
  community.general.pacman:
    name:
      - bash-completion
      - bluez
      - bluez-utils
      - brightnessctl
      - chezmoi
      - discord
      - fd
      - foot
      - gimp
      - grim
      - less
      - lib32-mesa
      - mako
      - man-db
      - noto-fonts
      - noto-fonts-cjk
      - noto-fonts-emoji
      - npm
      - openssh
      - slurp
      - swappy
      - sway
      - swaybg
      - tldr
      - tmux
      - tree
      - ttf-jetbrains-mono-nerd 
      - unzip
      - vim
      - waybar
      - wiremix
      - wl-clipboard
      - xdg-desktop-portal-gtk
      - xdg-desktop-portal-wlr
      - xdg-utils
      - xorg-xhost
      - xorg-xwayland
      - zip
    state: present
    update_cache: true

- name: install aur pkgs
  become: false
  ansible.builtin.command: paru -S brave-bin tofi xcursor-hackneyed-light --noconfirm
